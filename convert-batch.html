<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private CSV to EspoCRM Converter</title>
     <link rel="stylesheet" href="/styles/convert.css" />
</head>
<body>

    <h1>Convert CSV from AppointmentQuest to EspoCRM</h1>
    
    <!-- Drag and Drop Target -->
    <div id="drop-zone">
        <p>Drag & drop your source <strong>.csv</strong> file here, or click to browse</p>
        <input type="file" id="file-input" accept=".csv">
    </div>

    <div id="status"></div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const statusDiv = document.getElementById('status');

        dropZone.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('hover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('hover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files && files.length > 0) handleFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files && files.length > 0) handleFile(files[0]);
        });

        function handleFile(file) {
            if (!file) return;
            
            statusDiv.style.color = "#16a34a";
            statusDiv.textContent = "Processing: " + file.name + "...";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const incomingCsvText = e.target.result;
                    const espoCsvText = convertSourceCsvToEspoCSV(incomingCsvText);
                    
                    downloadCSV(espoCsvText, file.name.replace('.csv', '_for_espo.csv'));
                    statusDiv.textContent = "Success! CSV downloaded, import that to ESPO now.";
                } catch (err) {
                    console.error(err);
                    statusDiv.style.color = "#dc2626";
                    statusDiv.textContent = "Error parsing file format.";
                }
            };
            reader.readAsText(file);
        }

        function convertSourceCsvToEspoCSV(csvText) {
            // Precise internal system Field Names used for effortless auto-mapping
            const espoHeaders = [
                "name", 
                "cFullName", 
                "firstName", 
                "lastName", 
                "phoneNumber", 
                "emailAddress", 
                "addressStreet", 
                "addressCity", 
                "addressPostalCode", 
                "addressState", 
                "cPianoBrand", 
                "cPianoType"
            ];
            const csvRows = [espoHeaders.join(",")];

            // Split the file into clean text lines
            const lines = csvText.split(/\r?\n/);
            if (lines.length < 2) return csvRows.join("\n");

            // Parse out structural position layouts from row 0
            const headerRowTokens = parseCsvLine(lines[0]);
            
            const idxFn = headerRowTokens.indexOf("First Name");
            const idxLn = headerRowTokens.indexOf("Last Name");
            const idxPh = headerRowTokens.indexOf("Daytime Phone");
            const idxEm = headerRowTokens.indexOf("E-mail");
            const idxSt = headerRowTokens.indexOf("Street");
            const idxCi = headerRowTokens.indexOf("City");
            const idxSa = headerRowTokens.indexOf("State/Province");
            const idxZp = headerRowTokens.indexOf("ZIP/Postal Code");

            // Iterate record elements
            for (let i = 1; i < lines.length; i++) {
                const currentLineText = lines[i].trim();
                if (!currentLineText) continue;

                const dataFields = parseCsvLine(currentLineText);
                if (dataFields.length === 0) continue;

                const firstName = idxFn !== -1 ? (dataFields[idxFn] || "").trim() : "";
                const lastName = idxLn !== -1 ? (dataFields[idxLn] || "").trim() : "";
                const phoneNumber = idxPh !== -1 ? (dataFields[idxPh] || "").trim() : "";
                const emailAddress = idxEm !== -1 ? (dataFields[idxEm] || "").trim() : "";
                const street = idxSt !== -1 ? (dataFields[idxSt] || "").trim() : "";
                const city = idxCi !== -1 ? (dataFields[idxCi] || "").trim() : "";
                const state = idxSa !== -1 ? (dataFields[idxSa] || "").trim() : "";
                const zip = idxZp !== -1 ? (dataFields[idxZp] || "").trim() : "";

                const fullName = (firstName + " " + lastName).trim();
                
                // Generic spreadsheet source variants don't contain dedicated equipment fields
                const pianoBrand = "";
                const pianoType = "";

                const escapeCSV = (text) => {
                    if (!text) return '""';
                    return '"' + text.replace(/"/g, '""') + '"';
                };

                csvRows.push([
                    escapeCSV(fullName),      // name
                    escapeCSV(fullName),      // cFullName
                    escapeCSV(firstName),     // firstName
                    escapeCSV(lastName),      // lastName
                    escapeCSV(phoneNumber),   // phoneNumber
                    escapeCSV(emailAddress),  // emailAddress
                    escapeCSV(street),        // addressStreet
                    escapeCSV(city),          // addressCity
                    escapeCSV(zip),           // addressPostalCode
                    escapeCSV(state),         // addressState
                    escapeCSV(pianoBrand),    // cPianoBrand
                    escapeCSV(pianoType)      // cPianoType
                ].join(","));
            }

            return csvRows.join("\n");
        }

        // Standard regex algorithm to securely decode values that contain commas wrapped inside quotes
        function parseCsvLine(lineText) {
            const rowOutput = [];
            let activeToken = '';
            let insideQuotes = false;

            for (let i = 0; i < lineText.length; i++) {
                const currentChar = lineText.charAt(i);
                if (currentChar === '"') {
                    if (insideQuotes && lineText.charAt(i + 1) === '"') {
                        activeToken += '"';
                        i++;
                    } else {
                        insideQuotes = !insideQuotes;
                    }
                } else if (currentChar === ',' && !insideQuotes) {
                    rowOutput.push(activeToken.trim());
                    activeToken = '';
                } else {
                    activeToken += currentChar;
                }
            }
            rowOutput.push(activeToken.trim());
            return rowOutput;
        }

        function downloadCSV(csvText, filename) {
            const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
